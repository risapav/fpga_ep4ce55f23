<body>
<h1 id="modul-sync_fifo">Modul <code>sync_fifo</code></h1>
<h2 id="popis">Popis</h2>
<p>Synchrónne FIFO s podporou Byte Enable.</p>
<p>Single-clock FIFO. Optimalizované pre Intel M10K (no_rw_check).</p>
<h2 id="parametre">Parametre</h2>
<ul>
<li><code>DATA_WIDTH</code>: Šírka dát.</li>
<li><code>BE_WIDTH</code>: Šírka Byte Enable.</li>
<li><code>ADDR_WIDTH</code>: Šírka adresy (Hĺbka = 2^ADDR_WIDTH).</li>
</ul>
